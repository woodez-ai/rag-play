[project]
name = "ragplay"
version = "0.1.0"
description = "Credit card statement analyst: hybrid SQL + vector RAG on local Ollama"
authors = [
    { name = "kevinwood75", email = "kevin.wood75@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.scripts]
rag = "ragplay.cli:app"

[project.optional-dependencies]
llamaindex = [
    "llama-index-core>=0.14.26",
    "llama-index-embeddings-ollama>=0.11.0",
    "llama-index-llms-ollama>=0.12.0",
    "llama-index-vector-stores-postgres>=0.10.0",
]
web = [
    "django>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ragplay", "src/ragplay_llamaindex", "src/ragplay_web"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]

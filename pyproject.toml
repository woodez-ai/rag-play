[project]
name = "ragplay"
version = "0.1.0"
description = "Credit card statement analyst: hybrid SQL + vector RAG on local Ollama"
authors = [
    { name = "kevinwood75", email = "kevin.wood75@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "typer>=0.28.0",
]

[project.scripts]
rag = "ragplay.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]
